// Waldlust 원격지원 도우미(부록 A-44 1단계): Flutter·cargo 없이 이 폴더에서 Gradle 로만 빌드한다.
// 로컬 시험은 ./gradlew :app:assembleDebug(~/.android/debug.keystore — 메인 로컬 빌드와 같은 키).
// 배포본은 build-android-local.sh 가 수신 전용 빌드 때 메인 앱과 같은 버전·서명으로 함께 만든다(app/build.gradle).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.1'
        // 2단계 입력 제어(InputService.kt — 원격 앱 Kotlin 코드를 옮김). 원격 앱과 같은 버전(flutter/android/settings.gradle).
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.21'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
