plugins {
    id 'com.android.application'
}

android {
    namespace 'co.kr.waldlust.remote.helper'
    compileSdk 34

    defaultConfig {
        applicationId 'co.kr.waldlust.remote.helper'
        minSdk 22
        targetSdk 33
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
