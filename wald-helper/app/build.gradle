plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 정식 빌드(build-android-local.sh <태그> incoming release)는 메인 앱과 같은 릴리즈 키로 서명한다. 스크립트가 키 설정을
// 이 폴더의 key.properties(git 제외)로 복사했다가 지운다. 없으면 release 도 debug 키로 서명한다(로컬 시험 — 메인 시험 빌드와 같은 키).
def keyProps = new Properties()
def keyPropsFile = rootProject.file('key.properties')
if (keyPropsFile.exists()) {
    keyPropsFile.withInputStream { keyProps.load(it) }
}

android {
    namespace 'co.kr.waldlust.remote.helper'
    // AGP 7.3.1 의 aapt2 가 android-35 이상을 읽지 못해 34 로 둔다(새 API 는 쓰지 않는다 — targetSdk 만 최신).
    compileSdk 34

    defaultConfig {
        applicationId 'co.kr.waldlust.remote.helper'
        minSdk 22
        // targetSdk 33 이면 Google Play 프로텍트가 '이전 버전용 앱'으로 설치를 막는다(adb 설치 포함, 넘기려면 기기 PIN —
        // Android 14 IM-H092W 2026-10-20). 36 은 경고 없이 설치됐다. 메인 앱 깨우기 액션은 메인 BootReceiver 의 intent-filter 에 있어
        // Android 16 의 명시적 인텐트 일치 규칙에도 맞는다.
        targetSdk 36
        // 빌드 스크립트가 메인 앱과 같은 버전(정식은 태그에서 계산한 versionCode)을 넘긴다. 이 폴더에서 바로 빌드하면 dev.
        versionCode((project.findProperty('waldVersionCode') ?: '1').toString().toInteger())
        versionName((project.findProperty('waldVersionName') ?: 'dev').toString())
    }

    signingConfigs {
        release {
            if (keyPropsFile.exists()) {
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 로 줄인다(Kotlin stdlib 때문에 커진 크기 — 원격 앱 APK 안에도 들어간다). 매니페스트 컴포넌트·AIDL 은 참조돼 남고,
            // AIDL 설명자 문자열은 바뀌지 않아 원격 앱(축소 안 함)과 그대로 맞는다.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig keyPropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    // 원격 앱 ↔ 도우미 입력 브리지 AIDL 의 정본은 원격 앱 쪽 한 곳이다(두 앱이 같은 파일로 컴파일 — 어긋나지 않게).
    sourceSets {
        main {
            aidl.srcDirs += '../../flutter/android/app/src/main/aidl'
        }
    }
}

dependencies {
    // InputService.kt 의 @RequiresApi(원격 앱 코드를 그대로 옮겨 온 부분)
    implementation 'androidx.annotation:annotation:1.3.0'
    // 원격 앱과 같은 stdlib(flutter/android/app/build.gradle)
    implementation("org.jetbrains.kotlin:kotlin-stdlib") { version { strictly("1.9.10") } }
}
