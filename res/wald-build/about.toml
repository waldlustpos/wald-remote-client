# Waldlust(D35 — 명세 부록 A-25): Rust 크레이트 제3자 라이선스 고지(cargo-about 0.6.4 — Rust 1.75 로 설치된다).
# 사용: res/wald-build/collect-notices.sh 가 부른다. 정식 빌드 대상 플랫폼을 모두 넣어 한 번에 모은다(넘치게 넣는 것은 무해).
targets = [
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "x86_64-pc-windows-msvc",
    "i686-pc-windows-msvc",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
no-clearly-defined = true
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
    "NCSA",
    "IJG",
    "CDLA-Permissive-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
    "GPL-3.0",
    "AGPL-3.0",
]
